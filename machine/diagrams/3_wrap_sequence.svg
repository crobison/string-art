<text x="12.0" y="405.0" font-size="10" text-anchor="start" fill="#444" font-weight="normal">The tip only ever moves radially. The platter's own ±0.5-nail moves do the tangential sweep. In the platter's frame the</text>
<text x="12.0" y="420.0" font-size="10" text-anchor="start" fill="#444" font-weight="normal">tip circles nail n on the outside, so the thread hooks it and leaves inward. The tip is above the nail tops whenever</text>
<text x="12.0" y="435.0" font-size="10" text-anchor="start" fill="#444" font-weight="normal">it crosses the ring (B and D), so it never has to hit the 5 mm gap between nails.</text>
