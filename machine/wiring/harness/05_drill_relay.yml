# Generated by make_harness.py: Step 5: drill on the on-board relay
metadata:
  title: 'Step 5: drill on the on-board relay'
options:
  fontname: DejaVu Sans
  bgcolor: WH
  color_mode: full
connectors:
  WAGO+:
    type: Wago 221-415 lever nut
    subtype: +24 V bus (5-way)
    pinlabels:
    - +24V 1
    - +24V 2
    - +24V 3
    - +24V 4
    - +24V 5
    hide_disconnected_pins: true
    show_name: false
    pincolors:
    - RD
    - RD
    - RD
    - RD
    - RD
    notes: All 5 slots are the same point. Strip 11 mm, lift lever, insert, close.
  PIBOT_RLY:
    type: PiBot V4.96 Pro
    subtype: on-board relay terminal (gpio26)
    pinlabels:
    - COM
    - 'NO'
    - NC
    hide_disconnected_pins: true
    show_name: false
    notes: GPIO26 function jumper must be on Relay Output.
  DRILL:
    type: 555 drill motor
    subtype: 24 V, solder tabs
    pinlabels:
    - + (red dot)
    - '-'
    hide_disconnected_pins: true
    show_name: false
  WAGO-:
    type: Wago 221-415 lever nut
    subtype: GND bus (5-way)
    pinlabels:
    - GND 1
    - GND 2
    - GND 3
    - GND 4
    - GND 5
    hide_disconnected_pins: true
    show_name: false
    pincolors:
    - BK
    - BK
    - BK
    - BK
    - BK
    notes: All 5 slots are the same point.
  D1:
    type: 1N5822 diode
    subtype: flyback, solder across the drill tabs
    pinlabels:
    - K (stripe)
    - A
    hide_disconnected_pins: true
    show_name: false
    notes: Stripe end to the drill + tab. Backwards = dead short when the relay closes.
cables:
  Drill 24 V (18 AWG):
    category: bundle
    gauge: 18 AWG
    show_equiv: false
    colors:
