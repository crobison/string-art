# Generated by make_harness.py: Step 1: 24 V power distribution
metadata:
  title: 'Step 1: 24 V power distribution'
options:
  fontname: DejaVu Sans
  bgcolor: WH
  color_mode: full
connectors:
  PSU:
    type: 24 V power brick
    subtype: barrel adapter rated 10 A, or bare leads
    pinlabels:
    - +
    - '-'
    hide_disconnected_pins: true
    show_name: false
    pincolors:
    - RD
    - BK
    notes: Set the brick to 24.0 V (never higher) with a meter BEFORE connecting anything.
  WAGO+:
    type: Wago 221-415 lever nut
    subtype: +24 V bus (5-way)
    pinlabels:
    - +24V 1
    - +24V 2
    - +24V 3
    - +24V 4
    - +24V 5
    hide_disconnected_pins: true
    show_name: false
    pincolors:
    - RD
    - RD
    - RD
    - RD
    - RD
    notes: All 5 slots are the same point. Strip 11 mm, lift lever, insert, close.
  WAGO-:
    type: Wago 221-415 lever nut
    subtype: GND bus (5-way)
    pinlabels:
    - GND 1
    - GND 2
    - GND 3
    - GND 4
    - GND 5
    hide_disconnected_pins: true
    show_name: false
    pincolors:
    - BK
    - BK
    - BK
    - BK
    - BK
    notes: All 5 slots are the same point.
  PIBOT_PWR:
    type: PiBot V4.96 Pro
    subtype: orange power inputs, bottom edge
    pinlabels:
    - Vmot +
    - Vmot -
    - Vmot-Driver +
    - Vmot-Driver -
    hide_disconnected_pins: true
    show_name: false
    notes: 'Vmot (orange plug, CN3) powers the board. Vmot-Driver (CN4) powers the

      socket drivers. Both need 24 V. + and - are printed under each.

      "VMOT Main" on the black 5-pin header is an output: nothing goes there.'
  DM542T_HV:
    type: DM542T
    subtype: power + motor terminal
    pinlabels:
    - GND
    - +VDC
    - A+
    - A-
    - B+
    - B-
    hide_disconnected_pins: true
    show_name: false
    notes: Follow the labels printed on the driver, not this order.
cables:
  PSU leads:
    category: bundle
    gauge: 18 AWG
    show_equiv: false
    colors:
    - RD
    - BK
  PiBot Vmot:
    category: bundle
    gauge: 18 AWG
    show_equiv: false
    colors:
    - RD
    - BK
  PiBot Vmot-Driver:
    category: bundle
    gauge: 18 AWG
    show_equiv: false
    colors:
    - RD
    - BK
  DM542T power:
    category: bundle
    gauge: 18 AWG
    show_equiv: false
    colors:
    - RD
    - BK
connections:
- - PSU:
    - +
  - PSU leads:
    - 1
  - WAGO+:
    - +24V 1
- - PSU:
    - '-'
  - PSU leads:
    - 2
  - WAGO-:
    - GND 1
- - WAGO+:
    - +24V 2
  - PiBot Vmot:
    - 1
  - PIBOT_PWR:
    - Vmot +
- - WAGO-:
    - GND 2
  - PiBot Vmot:
    - 2
  - PIBOT_PWR:
    - Vmot -
- - WAGO+:
    - +24V 3
  - PiBot Vmot-Driver:
    - 1
  - PIBOT_PWR:
    - Vmot-Driver +
- - WAGO-:
    - GND 3
  - PiBot Vmot-Driver:
    - 2
  - PIBOT_PWR:
    - Vmot-Driver -
- - WAGO+:
    - +24V 4
  - DM542T power:
    - 1
  - DM542T_HV:
    - +VDC
- - WAGO-:
    - GND 4
  - DM542T power:
    - 2
  - DM542T_HV:
    - GND
